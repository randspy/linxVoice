name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version-file: .python-version
          enable-cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          uv sync --project backend --locked
          pnpm --dir frontend install --frozen-lockfile

      - name: Start PostgreSQL and Electric
        run: docker compose up -d --wait

      - name: Apply migrations
        run: make migrate

      - name: Verify generated contract
        run: |
          make generate
          git diff --exit-code -- openapi.json frontend/src/api/generated

      - name: Backend quality and tests
        run: |
          cd backend
          uv run ruff format --check src tests migrations
          uv run ruff check src tests migrations
          uv run mypy src
          uv run pytest --cov --cov-branch --cov-report=term-missing
          uv run pip-audit

      - name: Frontend quality and tests
        run: |
          pnpm --dir frontend format:check
          pnpm --dir frontend lint
          pnpm --dir frontend typecheck
          pnpm --dir frontend test:coverage
          pnpm --dir frontend build
          pnpm --dir frontend audit --audit-level high

      - name: Install Playwright browser
        run: pnpm --dir frontend exec playwright install --with-deps chromium

      - name: Real-stack browser tests
        run: pnpm --dir frontend test:e2e

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop local infrastructure
        if: always()
        run: docker compose down --volumes

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
