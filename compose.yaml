name: linxvoice

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: linxvoice
      POSTGRES_USER: linxvoice
      POSTGRES_PASSWORD: linxvoice
    command: ["postgres", "-c", "wal_level=logical"]
    ports:
      - "54321:5432"
    volumes:
      - linxvoice-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linxvoice -d linxvoice"]
      interval: 2s
      timeout: 3s
      retries: 20

  electric:
    image: electricsql/electric:1.7.12
    environment:
      DATABASE_URL: postgresql://linxvoice:linxvoice@postgres:5432/linxvoice?sslmode=disable
      ELECTRIC_INSECURE: "true"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  linxvoice-postgres:

