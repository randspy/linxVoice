[project]
name = "linxvoice-backend"
version = "0.1.0"
description = "Flask command API and Electric proxy for linxVoice"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "apiflask>=3.1.1,<4",
  "alembic>=1.19.1,<2",
  "httpx>=0.28.1,<1",
  "psycopg[binary]>=3.3.4,<4",
  "pydantic-settings>=2.15.0,<3",
  "sqlalchemy>=2.0.52,<3",
  "structlog>=26.1.0,<27",
]

[dependency-groups]
dev = [
  "mypy>=1.18,<2",
  "pip-audit>=2.9,<3",
  "pre-commit>=4,<5",
  "pytest>=9.1,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<1",
  "testcontainers[postgres]>=4.15,<5",
  "types-flask>=1.1,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linxvoice"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
markers = ["integration: requires Docker and PostgreSQL"]


[tool.coverage.run]
branch = true
source = ["linxvoice"]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
packages = ["linxvoice"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true
